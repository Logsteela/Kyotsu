name: o

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add database entries
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path('src/app/data/testDatabase.ts')
          details_path = Path('src/app/data/testDetailsDatabase.ts')

          db_entries = [
              ['2004','main','情報関係基礎','2004_情報関係基礎_問題例問題.pdf','2004_情報関係基礎_問題例解答.pdf','', '1'],
              ['2004','main','数学Ⅱ・数学Ｂ','2004_数学IIB_問題例問題.pdf','2004_数学IIB_問題例解答.pdf','', '1'],
              ['2004','main','理科総合Ａ','2004_理科総合A_問題例問題.pdf','2004_理科総合A_問題例解答.pdf','', '1'],
              ['2004','main','理科総合Ｂ','2004_理科総合B_問題例問題.pdf','2004_理科総合B_問題例解答.pdf','', '1'],
              ['2004','main','英語（リスニング）','2004_英語L_試行テスト問題.pdf','2004_英語L_試行テスト解答.pdf','2004_英語L_試行テスト音源.mp3','1'],
              ['2013','main','化学','2013_化学_試作問題.pdf','2013_化学_試作解答.pdf','', '1'],
              ['2013','main','地学','2013_地学_試作問題.pdf','2013_地学_試作解答.pdf','', '1'],
              ['2013','main','数学Ⅰ・数学Ａ','2013_数学IA_試作問題.pdf','2013_数学IA_試作解答.pdf','', '1'],
              ['2013','main','数学Ⅱ・数学Ｂ','2013_数学IIB_試作問題.pdf','2013_数学IIB_試作解答.pdf','', '1'],
              ['2013','main','物理','2013_物理_試作問題.pdf','2013_物理_試作解答.pdf','', '1'],
              ['2013','main','生物','2013_生物_試作問題.pdf','2013_生物_試作解答.pdf','', '1'],
          ]

          def add_tsv_entries(text: str) -> str:
              start_marker = 'const DATABASE_TSV = `\n'
              start = text.index(start_marker) + len(start_marker)
              end = text.index('`;', start)
              block = text[start:end]
              lines = block.splitlines()
              existing_questions = {line.split('\t')[3] for line in lines if line.strip() and len(line.split('\t')) >= 4}
              added_by_year = {}
              for entry in db_entries:
                  if entry[3] in existing_questions:
                      continue
                  added_by_year.setdefault(entry[0], []).append('\t'.join(entry))
                  existing_questions.add(entry[3])
              if not added_by_year:
                  return text
              new_lines = []
              inserted_years = set()
              for i, line in enumerate(lines):
                  year = line.split('\t', 1)[0] if line.strip() else ''
                  next_year = lines[i+1].split('\t', 1)[0] if i + 1 < len(lines) and lines[i+1].strip() else None
                  new_lines.append(line)
                  if year in added_by_year and year != next_year and year not in inserted_years:
                      new_lines.extend(added_by_year[year])
                      inserted_years.add(year)
              for year, add_lines in added_by_year.items():
                  if year not in inserted_years:
                      new_lines.extend(add_lines)
              new_block = '\n'.join(new_lines) + ('\n' if block.endswith('\n') else '')
              return text[:start] + new_block + text[end:]

          db_text = db_path.read_text(encoding='utf-8')
          new_db_text = add_tsv_entries(db_text)
          for entry in db_entries:
              if entry[3] not in new_db_text:
                  raise SystemExit(f'testDatabase missing requested entry: {entry[3]}')
          db_path.write_text(new_db_text, encoding='utf-8')

          details_entries = {
              '2004_情報関係基礎_問題例問題.pdf': "{questionPdf:'2004_情報関係基礎_問題例問題.pdf',implementationDate:'2004年12月22日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2004_数学IIB_問題例問題.pdf': "{questionPdf:'2004_数学IIB_問題例問題.pdf',implementationDate:'2004年12月22日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2004_理科総合A_問題例問題.pdf': "{questionPdf:'2004_理科総合A_問題例問題.pdf',implementationDate:'2004年12月22日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2004_理科総合B_問題例問題.pdf': "{questionPdf:'2004_理科総合B_問題例問題.pdf',implementationDate:'2004年12月22日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2004_英語L_試行テスト問題.pdf': "{questionPdf:'2004_英語L_試行テスト問題.pdf',implementationDate:'2004年9月26日',testDuration:'',totalScore:'',examinees:35365,averageScore:30.42,highestScore:50,lowestScore:0,standardDeviation:8.70,specialNotes:''}",
              '2013_化学_試作問題.pdf': "{questionPdf:'2013_化学_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2013_地学_試作問題.pdf': "{questionPdf:'2013_地学_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2013_数学IA_試作問題.pdf': "{questionPdf:'2013_数学IA_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2013_数学IIB_試作問題.pdf': "{questionPdf:'2013_数学IIB_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2013_物理_試作問題.pdf': "{questionPdf:'2013_物理_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
              '2013_生物_試作問題.pdf': "{questionPdf:'2013_生物_試作問題.pdf',implementationDate:'2013年11月12日',testDuration:'',totalScore:'',examinees:'',averageScore:'',highestScore:'',lowestScore:'',standardDeviation:'',specialNotes:''}",
          }

          det_text = details_path.read_text(encoding='utf-8')
          insert_marker = '\n};'
          idx = det_text.rindex(insert_marker)
          to_add = []
          for key, obj in details_entries.items():
              if f"'{key}'" not in det_text:
                  to_add.append(f"'{key}':{obj},")
          if to_add:
              det_text = det_text[:idx] + '\n' + '\n'.join(to_add) + det_text[idx:]
          for key in details_entries:
              if f"'{key}'" not in det_text:
                  raise SystemExit(f'testDetailsDatabase missing requested entry: {key}')
          details_path.write_text(det_text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o.yml
          git add src/app/data/testDatabase.ts src/app/data/testDetailsDatabase.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add trial test database entries"
          git push
