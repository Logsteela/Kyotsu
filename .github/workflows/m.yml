name: m

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/app/data/pdfManifest.json')
          before_text = path.read_text(encoding='utf-8')
          data = json.loads(before_text)
          files = data['files']
          before = list(files)

          additions = {
              '2004': [
                  '2004_情報関係基礎_問題例問題.pdf',
                  '2004_政治経済_追試験解答.pdf',
                  '2004_数学IIB_問題例問題.pdf',
                  '2004_理科総合A_問題例問題.pdf',
                  '2004_理科総合B_問題例問題.pdf',
                  '2004_簿記_追試験解答.pdf',
                  '2004_英語L_試行テスト問題.pdf',
                  '2004_英語L_試行テスト解答.pdf',
                  '2004_英語L_試行テスト音源.mp3',
              ],
              '2015': [
                  '2015_化学_試作問題.pdf',
                  '2015_地学_試作問題.pdf',
                  '2015_数学IA_試作問題.pdf',
                  '2015_数学IIB_試作問題.pdf',
                  '2015_旧数学II旧数学B_追試験問題.pdf',
                  '2015_旧数学II旧数学B_追試験解答.pdf',
                  '2015_旧数学I旧数学A_追試験問題.pdf',
                  '2015_旧数学I旧数学A_追試験解答.pdf',
                  '2015_物理_試作問題.pdf',
                  '2015_生物_試作問題.pdf',
              ],
          }

          for year, items in additions.items():
              missing = [item for item in items if item not in files]
              if not missing:
                  continue
              indices = [i for i, item in enumerate(files) if item.startswith(f'{year}_')]
              insert_at = (max(indices) + 1) if indices else len(files)
              files[insert_at:insert_at] = missing

          if not all(item in files for item in before):
              raise SystemExit('Refusing to write: an existing manifest entry would be removed')

          for year_items in additions.values():
              for item in year_items:
                  if item not in files:
                      raise SystemExit(f'Missing requested entry after update: {item}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m.yml
          git add src/app/data/pdfManifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Add PDF manifest entries"
          git push
